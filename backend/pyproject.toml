[project]
name = "llm-polyglot-exam"
version = "0.1.0"
description = "Which languages, and which dialects, can a model actually produce?"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# GlotLID. Without it the gate checks script but not *language*, and a model
# answering in Indonesian when asked for Acehnese would pass.
lid = ["fasttext-wheel>=0.9.2", "huggingface-hub>=0.23", "numpy>=1.26"]

[project.scripts]
polyglot = "polyglot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polyglot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
