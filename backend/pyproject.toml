[project]
name = "llm-polyglot-exam"
version = "0.1.0"
description = "Which languages, and which dialects, can a model actually produce?"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# GlotLID's runtime. Without it the gate checks the writing system but not the
# *language*, and a model answering in Indonesian when asked for Acehnese
# passes. An extra only because browsing stored results needs none of it --
# anything that serves the page installs it, host and container alike.
#
# No huggingface-hub: the model is fetched with urllib straight from the CDN
# URL in `lid.MODEL_URL`, and a declared dependency nothing imports is weight
# in every environment plus a supply-chain surface for nothing.
lid = ["fasttext-wheel>=0.9.2", "numpy>=1.26"]

[project.scripts]
polyglot = "polyglot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polyglot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
