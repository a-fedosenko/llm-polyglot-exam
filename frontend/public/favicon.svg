  <circle cx="9"  cy="11" r="3.4" fill="#4ec08a"/>
  <circle cx="9"  cy="21" r="3.4" fill="#e0a33c"/>
  <circle cx="23" cy="11" r="3.4" fill="#e06a57"/>
  <circle cx="23" cy="21" r="3.4" fill="#5b8cf0"/>
</svg>
